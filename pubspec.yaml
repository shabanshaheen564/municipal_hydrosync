name: municipal_hydrosync
description: "Municipal water field operations application."
publish_to: 'none'
version: 1.0.1+3

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.4.0
  shared_preferences: ^2.5.3
  flutter_map: ^8.1.1
  latlong2: ^0.9.1
  geolocator: ^14.0.2
  hive_ce: ^2.20.0
  hive_ce_flutter: ^2.3.4
  connectivity_plus: ^6.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/deir_al_balah_municipality.png"
  adaptive_icon_background: "#FFFFFF"
  min_sdk_android: 21
